app-id: com.dcotecnologia.KubeScope
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: kubescope

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --device=dri
  # read-only access to the user's kubeconfig; kubectl is bundled with the app
  - --filesystem=~/.kube:ro
  # EKS kubeconfigs call `aws eks get-token`; the CLI is bundled below and needs the
  # profiles, and write access for the SSO and token caches under ~/.aws
  - --filesystem=~/.aws

modules:
  - name: awscli
    buildsystem: simple
    build-commands:
      - ./aws/install --install-dir /app/aws-cli --bin-dir /app/bin
    sources:
      - type: archive
        archive-type: zip
        strip-components: 0
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.11.zip
        sha256: 41e1cf5e301ed04ece2ca3c2d8bdf6c3584e8b67292269689cc3e80f97de71ea
        only-arches: [x86_64]

  - name: kubescope
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib /app/bin
      - cp -a bundle /app/lib/kubescope
      - ln -s ../lib/kubescope/KubeScope /app/bin/kubescope
      - install -Dm644 com.dcotecnologia.KubeScope.desktop -t /app/share/applications
      - install -Dm644 com.dcotecnologia.KubeScope.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.dcotecnologia.KubeScope.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.dcotecnologia.KubeScope.png
    sources:
      # staged by tools/build_flatpak.py from `make build`
      - type: dir
        path: bundle
        dest: bundle
      - type: file
        path: com.dcotecnologia.KubeScope.desktop
      - type: file
        path: com.dcotecnologia.KubeScope.metainfo.xml
      - type: file
        path: icon-256.png
      - type: file
        path: icon-512.png
