---
exclude: '^(cdk\.out/|src/kubescope/ui/ui_.*\.py$)'
default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - pre-merge-commit

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.svg$|\.log$|\.txt$'
      - id: check-added-large-files
        exclude: '^src/kubescope/assets/fonts/'  # the bundled fonts are ~500 KB each
      - id: fix-byte-order-marker
      - id: check-docstring-first
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-ensure-ascii]
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: file-contents-sorter
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/qt\.py$  # shared helpers, not a test module
      - id: sort-simple-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args:
          - --fix
          - --config=pyproject.toml

      - id: ruff-format
        args:
          - --config=pyproject.toml

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        args:
          - --in-place
          - --config=pyproject.toml

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: default, rules: {document-start: disable, line-length: disable, truthy: disable, comments-indentation: disable}}"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--fix"]

  - repo: local
    hooks:
      - id: pyright
        name: check the types like Pylance does
        entry: uv run --frozen --extra dev pyright
        language: system
        types: [python]
        pass_filenames: false
      # the same three checks CI runs after pre-commit, so a commit that would
      # fail them is not accepted here either
      - id: generated-ui
        name: regenerate the ui_*.py files from the .ui files
        entry: >-
          sh -c 'for file in src/kubescope/ui/*.ui; do
          uv run --frozen pyside6-uic "$file" -o "${file%/*}/ui_$(basename "$file" .ui).py";
          done'
        language: system
        files: ^src/kubescope/ui/.*\.ui$
        pass_filenames: false
      - id: changelog-copy
        name: copy the changelog into the package
        entry: uv run --frozen python tools/sync_changelog.py
        language: system
        files: ^(CHANGELOG\.md|src/kubescope/assets/CHANGELOG\.md)$
        pass_filenames: false
      - id: language-files
        name: list the texts of the code in the language files
        entry: uv run --frozen python tools/i18n.py
        language: system
        files: ^src/kubescope/.*\.(py|ui)$|^src/kubescope/languages/.*\.json$
        pass_filenames: false
      - id: third-party-notices
        name: rewrite the third-party notices when uv.lock changes
        # reads the licenses of the installed packages, and `uv run --frozen`
        # first installs the versions of the lock
        entry: uv run --frozen python tools/third_party_notices.py
        language: system
        files: ^uv\.lock$
        pass_filenames: false
      - id: no-merge-commit
        name: block merge commits (rebase-only)
        entry: >-
          Merge commit blocked: this project uses rebase only.
          Run: git fetch origin && git rebase origin/dev
        language: fail
        always_run: true
        stages: [pre-merge-commit]
