title: KubeScope
description: Desktop IDE for Kubernetes.

app_name: KubeScope
app_icon: assets/icon.png
app_screenshot: screenshots/overview.png
app_description: A desktop IDE for Kubernetes, including Amazon EKS, Google GKE and Azure AKS. Read-only by default, with no kubectl needed, and with Gabi, an AI assistant for your cluster.

# Google Tag Manager container (GTM-XXXXXXX); empty leaves the tag out of the pages
google_tag_manager_id: "GTM-NF8JJ4QQ"
# Google Analytics 4 measurement ID (G-XXXXXXXXXX); empty leaves the tag out of the pages
google_analytics_id: "G-17B6Y96186"

repo_url: https://github.com/dcotecnologia/kubescope
company_name: DCO Tecnologia
company_url: https://dcotecnologia.com

# Links of the top bar
nav:
  - title: Install
    url: /install/
  - title: Gabi
    url: /assistant/
  - title: Guides
    url: https://github.com/dcotecnologia/kubescope/wiki
  - title: Source
    url: https://github.com/dcotecnologia/kubescope

# The features of the home page: a symbol, a title and a text
features:
  - icon: "◎"
    title: Cluster overview
    description: Nodes, Pod counts, and CPU and memory requests against capacity.
  - icon: "▤"
    title: Workloads
    description: Pods, Deployments, StatefulSets and more, with status, CPU, memory and restarts, filtered by namespace and searchable.
  - icon: "{ }"
    title: Details and logs
    description: JSON details and live Pod logs, each in its own tab.
  - icon: "☁"
    title: Every cloud
    description: Amazon EKS, Google GKE and Azure AKS through your local kubeconfig, with the official Kubernetes Python client.
  - icon: "❖"
    title: Gabi, the assistant
    description: An AI that sees what you see, looks into problems and takes you to the right screen. She uses the Claude Code or Codex already on your computer, asks for no credentials, and never changes a cluster without your confirmation.
  - icon: "✎"
    title: Write mode
    description: Off by default. Turn it on to delete or evict Pods, scale or restart Deployments, and forward ports, only where the cluster lets you.
  - icon: "✦"
    title: Readable errors
    description: Short messages with a hint, with the original error one click away, in 20 languages.

exclude:
  - wiki
  - README.md

sass:
  style: compressed
