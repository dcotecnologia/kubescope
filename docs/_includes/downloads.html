<div class="downloads">
	<p id="download-version">Direct downloads of the <a href="{{ site.repo_url }}/releases/latest">latest release</a>:</p>
	<ul id="downloads">
		<li><a data-asset="\.deb$" href="{{ site.repo_url }}/releases/latest">Debian and Ubuntu (.deb)</a></li>
		<li><a data-asset="\.AppImage$" href="{{ site.repo_url }}/releases/latest">Any Linux (AppImage)</a></li>
		<li><a data-asset="-windows-x64-setup\.exe$" href="{{ site.repo_url }}/releases/latest">Windows installer (.exe)</a></li>
		<li><a data-asset="-windows-x64\.zip$" href="{{ site.repo_url }}/releases/latest">Windows portable (.zip)</a></li>
	</ul>
	<script>
		// File names carry the version, so the links are resolved from the latest release.
		// Without JavaScript they stay pointed at the release page.
		fetch("https://api.github.com/repos/dcotecnologia/kubescope/releases/latest")
			.then(function (response) { return response.ok ? response.json() : Promise.reject(); })
			.then(function (release) {
				document.querySelectorAll("#downloads a[data-asset]").forEach(function (link) {
					var pattern = new RegExp(link.dataset.asset);
					var asset = release.assets.find(function (item) { return pattern.test(item.name); });
					if (asset) { link.href = asset.browser_download_url; }
				});
				document.getElementById("download-version").textContent =
					"Direct downloads of KubeScope " + release.tag_name.replace(/^v/, "") + ":";
			})
			.catch(function () {});
	</script>
</div>
