<div class="downloads">
	<a id="download-main" class="downloadMain" href="{{ site.repo_url }}/releases/latest">Download</a>
	<p id="download-version" class="downloadVersion">Latest release · <a href="{{ site.repo_url }}/releases/latest">all versions</a></p>
	<details class="downloadOthers">
		<summary>Other downloads</summary>
		<dl id="downloads">
			<dt>Windows</dt>
			<dd>
				<a data-asset="-windows-x64-setup\.exe$" href="{{ site.repo_url }}/releases/latest">Installer (.exe)</a>
				<a data-asset="-windows-x64\.zip$" href="{{ site.repo_url }}/releases/latest">Portable (.zip)</a>
			</dd>
			<dt>macOS</dt>
			<dd>
				<a data-asset="-macos-arm64\.zip$" href="{{ site.repo_url }}/releases/latest">Apple silicon (.zip)</a>
				<a data-asset="-macos-x86_64\.zip$" href="{{ site.repo_url }}/releases/latest">Intel (.zip)</a>
			</dd>
			<dt>Linux</dt>
			<dd>
				<a data-asset="\.deb$" href="{{ site.repo_url }}/releases/latest">Debian, Ubuntu (.deb)</a>
				<a data-asset="\.AppImage$" href="{{ site.repo_url }}/releases/latest">AppImage</a>
				<a data-asset="\.snap$" href="{{ site.repo_url }}/releases/latest">Snap</a>
			</dd>
		</dl>
	</details>
	<script>
		// File names carry the version, so the links are resolved from the latest release.
		// Without JavaScript they stay pointed at the release page.
		(function () {
			var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
			var agent = navigator.userAgent || "";
			var main = { name: "Linux", asset: "\\.AppImage$" };
			if (/Win/i.test(platform) || /Windows/i.test(agent)) { main = { name: "Windows", asset: "-windows-x64-setup\\.exe$" }; }
			else if (/Mac/i.test(platform) && !/iPhone|iPad/i.test(agent)) { main = { name: "macOS", asset: "-macos-arm64\\.zip$" }; }
			fetch("https://api.github.com/repos/dcotecnologia/kubescope/releases/latest")
				.then(function (response) { return response.ok ? response.json() : Promise.reject(); })
				.then(function (release) {
					function find(pattern) {
						var regex = new RegExp(pattern);
						return release.assets.find(function (item) { return regex.test(item.name); });
					}
					document.querySelectorAll("#downloads a[data-asset]").forEach(function (link) {
						var asset = find(link.dataset.asset);
						if (asset) { link.href = asset.browser_download_url; }
					});
					var asset = find(main.asset);
					var button = document.getElementById("download-main");
					if (asset) {
						button.href = asset.browser_download_url;
						button.textContent = "Download for " + main.name;
					}
					document.getElementById("download-version").innerHTML =
						"Version " + release.tag_name.replace(/^v/, "") +
						(main.name === "macOS" ? " · Apple silicon (Intel Mac: see other downloads)" : "") +
						" · <a href=\"" + release.html_url + "\">release notes</a>";
				})
				.catch(function () {});
		})();
	</script>
</div>
