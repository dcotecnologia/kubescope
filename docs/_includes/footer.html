<footer>
	<p class="footerText"><a href="{{ site.company_url }}">{{ site.company_name }}</a> · MIT license</p>
	<div class="footerLinks">
		<a href="{{ '/install/' | relative_url }}" target="_self">Install</a>
		<a href="{{ '/guides/' | relative_url }}" target="_self">Guides</a>
		<a href="{{ '/extensions/' | relative_url }}" target="_self">Extensions</a>
		<a href="{{ site.repo_url }}">Source code</a>
		<a href="{{ site.repo_url }}/blob/main/CHANGELOG.md">Changelog</a>
		<a href="{{ site.repo_url }}/blob/main/SECURITY.md">Security</a>
	</div>
	{% if site.social %}
	<div class="socialLinks">
		{% for one in site.social %}<a href="{{ one.url }}" rel="me noopener" aria-label="{{ one.name }}" title="{{ one.name }}"><span style="-webkit-mask-image: url('{{ '/assets/social/' | append: one.icon | append: '.svg' | relative_url }}'); mask-image: url('{{ '/assets/social/' | append: one.icon | append: '.svg' | relative_url }}');"></span></a>{% endfor %}
	</div>
	{% endif %}
</footer>
