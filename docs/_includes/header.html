<header>
	<a class="logo" href="{{ '/' | relative_url }}" target="_self">
		<img class="headerIcon" src="{{ site.app_icon | relative_url }}" alt="">
		<span class="headerName">{{ site.app_name }}</span>
	</a>
	<nav>
		<ul>
			{% for item in site.nav %}
			<li><a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}">{{ item.title }}</a></li>
			{% endfor %}
		</ul>
	</nav>
</header>
