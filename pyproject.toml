[project]
name = "kubescope"
version = "0.1.0"
description = "Desktop viewer for Kubernetes and Amazon EKS workloads"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
build = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
kubescope = "kubescope.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubescope = ["translations/*.qm", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/kubescope/ui/ui_*.py", "vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
development = [
    "pre-commit>=4.6.2",
]
