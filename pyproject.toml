[project]
name = "kubescope"
version = "0.1.0"
description = "Desktop viewer for Kubernetes and Amazon EKS workloads"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
build = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
kubescope = "kubescope.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubescope = [
    "translations/*.qm",
    "assets/*.png",
    "assets/*.ico",
    "community_themes/*.json",
]

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "WARNING"
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -s --cov=kubescope --log-level=WARN --strict-markers --tb=short --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --cov-config=pyproject.toml"
markers = [
    "slow: mark test as slow to run",
    "integration: integration test",
    "unit: unit test",
    "api: API test",
    "auth: authentication related",
]

[tool.ruff]
line-length = 88
target-version = "py312"
required-version = ">=0.15.7"
extend-exclude = ["src/kubescope/ui/ui_*.py", "vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
development = [
    "pre-commit>=4.6.2",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.run]
omit = ["src/kubescope/ui/ui_*.py"]
