name: Release

# Builds the installable packages. Run it by hand ("Run workflow") to get the
# files as artifacts, or push a tag like v0.1.0 to also publish a GitHub release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which packages to build
        type: choice
        options: [all, linux, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (.deb and AppImage)
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    # the oldest runner keeps the glibc requirement low, so more distros work
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra build --frozen

      - name: Fetch kubectl and the Qt XCB library
        run: |
          uv run python tools/fetch_kubectl.py
          uv run python tools/fetch_linux_qt_libs.py

      - name: Build the bundle
        run: uv run pyinstaller --noconfirm KubeScope.spec
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the .deb
        run: uv run python tools/build_deb.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the AppImage
        run: uv run python tools/build_appimage.py

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer and portable zip)
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'linux'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra build --frozen

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable zip
        run: uv run python tools/build_windows.py

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          generate_release_notes: true
