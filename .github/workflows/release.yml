name: Release

# Builds the installable packages. Run it by hand ("Run workflow") to get the
# files as artifacts, or push a tag like v0.1.0 to also publish a GitHub release.
# The snap and the Flatpak are not sent to their stores from here: upload them by hand.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which packages to build
        type: choice
        options: [all, linux, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux (.deb, AppImage and snap)
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    # the oldest runner keeps the glibc requirement low, so more distros work
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra build --frozen

      - name: Copy the changelog into the package
        run: uv run python tools/sync_changelog.py

      - name: Fetch the Qt XCB library
        run: |
          uv run python tools/fetch_linux_qt_libs.py

      - name: Build the bundle
        run: uv run pyinstaller --noconfirm KubeScope.spec
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the .deb
        run: uv run python tools/build_deb.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the AppImage
        run: uv run python tools/build_appimage.py

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

      # snapcraft packs the same bundle in a clean Ubuntu 24.04 (core24) container
      - name: Lay out the snap
        run: uv run python tools/build_snap.py --stage

      - name: Build the snap
        uses: snapcore/action-build@v1
        with:
          path: build/snap

      - uses: actions/upload-artifact@v7
        with:
          name: snap-package
          path: build/snap/*.snap
          if-no-files-found: error

  flatpak:
    name: Flatpak
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install Flatpak and its runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11

      - name: Install dependencies
        run: uv sync --extra dev --extra build --frozen

      # the icons of the Flatpak are drawn with Qt
      - name: Build the Flatpak
        run: uv run python tools/build_flatpak.py
        env:
          FLATPAK_BUILDER_ARGS: --user
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-package
          path: dist/*.flatpak
          if-no-files-found: error

  windows:
    name: Windows (installer and portable zip)
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'linux'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra build --frozen

      - name: Copy the changelog into the package
        run: uv run python tools/sync_changelog.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable zip
        run: uv run python tools/build_windows.py

      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      # the release says what the changelog says about this version
      - name: Write the release notes from the changelog
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          body_path: release-notes.md
          # v1.3.0-rc1 is a pre-release: GitHub does not make it the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
