name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # the pre-commit config pins Python 3.14 for its hook environments
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Generated UI code is up to date
        run: |
          for file in src/kubescope/ui/*.ui; do
            uv run pyside6-uic "$file" -o "${file%/*}/ui_$(basename "$file" .ui).py"
          done
          git diff --exit-code -- src/kubescope/ui \
            || (echo "Run 'make ui' and commit the regenerated ui_*.py" && exit 1)

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -q
