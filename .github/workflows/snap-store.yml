name: Snap Store

# Sends the snap that the Release workflow built for a tag to the Snap Store, in the
# candidate channel: a person promotes it to stable after trying it. It runs by itself
# when a Release of a v* tag succeeds. Run it by hand to send the snap of any Release
# run again, or to a channel other than candidate.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Id of the Release run that built the snap
        required: true
      channel:
        description: Channel of the store to release to
        type: choice
        options: [candidate, beta, edge, stable]
        default: candidate

permissions:
  contents: read
  actions: read # to download the snap that the Release run uploaded

jobs:
  publish:
    name: Send the snap to the store
    # only a Release of a pushed tag is sent on its own, never a run for a branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    # shows each send under Deployments of the repository, with a link to the app in
    # the store; a rule on this environment (required reviewers) can hold a send, and
    # the credentials can be kept as a secret of the environment
    environment:
      name: snap-store
      url: https://snapcraft.io/dco-kubescope
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap-package
          path: snap
          run-id: ${{ inputs.run-id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Without the credentials the run only warns; nothing else depends on it.
      - name: Look for the store credentials
        id: store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          echo "file=$(ls snap/*.snap)" >> "$GITHUB_OUTPUT"
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was not sent to the store"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: snapcore/action-publish@v1
        if: steps.store.outputs.present == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.store.outputs.file }}
          release: ${{ inputs.channel || 'candidate' }}
